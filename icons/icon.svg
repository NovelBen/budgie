<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle rounded corners for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="245" r="145" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" opacity="0.35" filter="url(#glow)"/>

  <!-- Stylized Geometric Budgie Bird & Dollar Wing -->
  <g transform="translate(256, 250)">
    <!-- Main Bird Body -->
    <path d="M-40,65 C-80,45 -95,-10 -80,-65 C-65,-120 0,-130 50,-115 C90,-100 105,-60 100,-10 C95,45 20,80 -40,65 Z" 
          fill="url(#emeraldGrad)" filter="url(#glow)"/>
    
    <!-- Wing Arc / Feather Layers (shaped like growth curves / dollar curve) -->
    <path d="M-15,-20 C25,-60 85,-40 95,20 C100,50 80,95 20,105 C-25,115 -60,85 -45,45 C-30,5 -35,5 -15,-20 Z" 
          fill="url(#cyanGrad)" opacity="0.92"/>

    <!-- Sharp Beak -->
    <polygon points="50,-115 110,-95 65,-75" fill="url(#goldGrad)"/>

    <!-- Bird Eye with Sparkle -->
    <circle cx="25" cy="-90" r="10" fill="#090d16"/>
    <circle cx="28" cy="-93" r="3.5" fill="#ffffff"/>

    <!-- Tail Feathers -->
    <path d="M-75,55 L-130,120 L-100,60 L-145,150 L-65,75 Z" fill="#059669" opacity="0.85"/>

    <!-- Currency / Coin Accent floating above -->
    <circle cx="0" cy="5" r="28" fill="rgba(10, 16, 29, 0.75)" stroke="#34d399" stroke-width="3.5"/>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#34d399" text-anchor="middle">$</text>
  </g>
</svg>
